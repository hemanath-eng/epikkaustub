display_information:
  name: Kaustub's PA
  description: Kaustub's personal assistant for CDE demos. Ask about demos and CDE ratings, and message CDEs.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Kaustub's PA
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - im:write
      - im:history
      - im:read
      - files:read
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
# Events are switched on AFTER the secrets are stored in Supabase (see README), because Slack
# verifies the request URL and the function rejects anything it cannot verify.
